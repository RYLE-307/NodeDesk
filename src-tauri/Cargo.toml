[package]
name = "nodedesk"
version = "0.2.0-alpha.0"
description = "Offline-first infrastructure workspace"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "nodedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
