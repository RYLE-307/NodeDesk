name: Frontend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  desktop:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          # The runner's Azure mirror can stall large WebKit downloads. Use the
          # official Ubuntu archive with normal signed repository verification.
          # Current runner images use mirror+file indirection (runner-images #14823).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf openssh-server
      - run: npm ci
      - name: Rust tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Isolated Windows native SSH/SFTP integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install paramiko==4.0.0
          ./tests/windows-sftp-fixture.ps1
      - name: Rust tests and real OpenSSH host-key integration (Linux)
        if: runner.os == 'Linux'
        run: bash tests/ssh-fixture.sh
      - run: npm run tauri build -- --no-bundle
      - name: Prepare verified NSIS tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ops/packaging/prepare-nsis.ps1
      - name: Bundle Windows installer preview
        if: runner.os == 'Windows'
        run: npm run tauri bundle -- --config ops/packaging/preview-windows.json --bundles nsis --no-sign --ci
      - name: Bundle Linux package preview
        if: runner.os == 'Linux'
        run: npm run tauri bundle -- --config ops/packaging/preview-linux.json --bundles deb --ci
      - name: Checksum Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem -LiteralPath $folder -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath "$folder/SHA256SUMS.txt"
      - name: Checksum Linux package
        if: runner.os == 'Linux'
        run: cd src-tauri/target/release/bundle/deb && sha256sum ./*.deb > SHA256SUMS.txt
      - name: Windows preview for read-only desktop QA
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nodedesk-windows-preview
          path: src-tauri/target/release/nodedesk.exe
          if-no-files-found: error
      - name: Windows installer preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nodedesk-windows-nsis-preview
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
      - name: Linux package preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nodedesk-linux-deb-preview
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/SHA256SUMS.txt
          if-no-files-found: error
